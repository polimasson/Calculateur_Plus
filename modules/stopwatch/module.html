<div class="chrono-wrapper">
    <div id="chrono-display">00:00:00<span>.000</span></div>

    <div class="chrono-controls">
        <button id="startBtn" class="btn-main">Démarrer</button>
        <button id="pauseBtn" class="btn-warn">Pause</button>
        <button id="lapBtn" class="btn-info" disabled>Tour</button>
        <button id="resetBtn" class="btn-danger">Reset</button>
    </div>

    <div id="laps-header">
        <h3>Tours</h3>
        <button id="clearLapsBtn" class="btn-small" disabled>Effacer</button>
    </div>
    <div id="laps-container">
        <div id="laps-list"></div>
    </div>
</div>
