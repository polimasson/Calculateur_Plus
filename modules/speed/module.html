<h2>Convertisseur de Vitesse</h2>

<div class="conv-form">
    <label for="input">Valeur :</label>
    <input type="number" id="input" placeholder="Entrez une valeur">
</div>

<div id="mach-config" style="display: none; margin: 10px 0; padding: 10px; background: rgba(0,0,0,0.05); border-radius: 8px;">
    <label for="mach-temp">Température pour Mach :</label>
    <input type="number" id="mach-temp" value="15" style="width: 80px;"> <span>°C</span>
    <small style="display: block; color: #666; margin-top: 5px;">La vitesse du son varie avec la température</small>
</div>

<div class="conv-form">
    <label for="from">Unité :</label>
    <select id="from"></select>
    <span>→</span>
    <select id="to"></select>
</div>

<div id="precision-options">
    <label for="precision-input">
        Précision
        <span class="tooltip">(?)
            <span class="tooltip-text">Nombre de chiffres après la virgule</span>
        </span> :
    </label>
    <input type="number" id="precision-input" value="10" min="0" max="20">
</div>

<button id="btn-convert">Convertir</button>

<p id="result"></p>
