<h2>PGCD / PPCM & Décomposition en facteurs premiers</h2>

    <label for="n1">Nombre 1 :</label>

</div>

<div class="conv-form">
    <label for="n2">Nombre 2 :</label>
    <input type="number" id="n2" placeholder="Entrez un entier">
</div>

<p id="result-gcd"></p>
<p id="result-lcm"></p>
